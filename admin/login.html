<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal Login - TravelEase</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body style="background: #0f172a;">

  <main class="auth-wrapper" style="min-height: 100vh; background: transparent;">
    <div class="auth-card" style="max-width: 480px; grid-template-columns: 1fr; border-color: #1e293b;">
      <div class="auth-form-side" style="padding: 3rem 2.5rem;">
        <div class="auth-header" style="text-align: center;">
          <div style="width: 56px; height: 56px; border-radius: 12px; background: linear-gradient(135deg, var(--primary) 0%, #ff4b72 100%); display: flex; align-items: center; justify-content: center; font-size: 1.8rem; margin: 0 auto 1rem; color: #fff;">
            🔐
          </div>
          <h2>Admin Portal</h2>
          <p>Sign in to manage transport fleets, bookings, and revenue</p>
        </div>

        <form id="adminLoginForm" class="auth-form" novalidate>
          <div class="form-group">
            <label for="adminEmail">Admin Email</label>
            <div class="form-control-wrapper has-icon">
              <span class="form-icon-left">✉️</span>
              <input 
                type="email" 
                id="adminEmail" 
                value="admin@gmail.com" 
                placeholder="admin@gmail.com" 
                required
              >
            </div>
          </div>

          <div class="form-group">
            <label for="adminPassword">Admin Password</label>
            <div class="form-control-wrapper has-icon">
              <span class="form-icon-left">🔒</span>
              <input 
                type="password" 
                id="adminPassword" 
                value="admin123" 
                placeholder="••••••••" 
                required
              >
            </div>
          </div>

          <button type="submit" class="btn btn-primary auth-submit-btn">
            Login to Admin Dashboard
          </button>

          <!-- Quick Test Credentials Hint -->
          <div class="demo-credentials-box">
            <div class="title">Demo Credentials:</div>
            <div>Email: <code>admin@gmail.com</code></div>
            <div>Password: <code>admin123</code></div>
          </div>
        </form>

        <div class="auth-footer" style="margin-top: 1.5rem;">
          <a href="../index.html" style="color: var(--secondary);">← Back to TravelEase Main Website</a>
        </div>
      </div>
    </div>
  </main>

  <!-- Scripts -->
  <script src="../js/data.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/admin.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // If already logged in, redirect directly to dashboard
      Admin.checkAuth(true);

      const form = document.getElementById("adminLoginForm");
      form.addEventListener("submit", (e) => {
        e.preventDefault();

        const email = document.getElementById("adminEmail").value.trim();
        const password = document.getElementById("adminPassword").value;

        const res = Admin.login(email, password, true);

        if (res.success) {
          showToast(res.message, "success");
          setTimeout(() => {
            window.location.href = "dashboard.html";
          }, 800);
        } else {
          showToast(res.message, "error");
        }
      });
    });
  </script>
</body>
</html>
